# Déploie le site sur GitHub Pages à chaque push sur main,
# en écrivant la vraie version (commit + date) dans js/version.js.
name: Déploiement Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Écrire la version (commit + date, heure de Paris)
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(TZ=Europe/Paris git log -1 --date=format-local:'%d/%m %H:%M' --format=%cd)
          echo "export const VERSION = \"${SHA} · ${DATE}\";" > js/version.js
          cat js/version.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
